<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>House of Deceit | Countdown Control</title>
  <link rel="icon" type="image/png" href="../assets/logos/eyes-icon.png">
  <style>
    :root{--black:#070609;--panel:#111014;--cream:#f5ead8;--red:#c91f2c;--yellow:#ffe600;--muted:#aaa2ad}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--black);color:var(--cream);font-family:Arial,sans-serif}
    body{padding:28px 18px 60px}
    .wrap{width:min(980px,100%);margin:auto}
    .logo{display:block;width:min(420px,75vw);max-height:125px;object-fit:contain;margin:0 auto 26px}
    .eyebrow{margin:0 0 8px;color:var(--yellow);font-size:.82rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:0 0 28px;font:900 clamp(2.2rem,6vw,4.6rem)/.95 Georgia,serif}
    .panel{background:var(--panel);border:1px solid #38313c;border-left:5px solid var(--yellow);border-radius:12px;padding:clamp(20px,4vw,38px)}
    .field{margin-bottom:24px}
    label{display:block;margin-bottom:9px;font-size:1rem;font-weight:900;color:var(--yellow);letter-spacing:.06em;text-transform:uppercase}
    input,select,button{font:800 1.15rem/1.2 Arial,sans-serif}
    input,select{width:100%;min-height:62px;padding:14px 16px;background:#050505;color:#fff;border:2px solid #4a424d;border-radius:7px}
    input:focus,select:focus{outline:none;border-color:var(--yellow)}
    .inline{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px}
    .duration{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 180px;gap:12px}
    .duration label{color:var(--cream);font-size:.8rem}
    button{min-height:62px;padding:13px 20px;border:0;border-radius:7px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}
    button.secondary{background:#29252d;border:2px solid var(--yellow);color:var(--yellow)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
    #status{display:block;min-height:28px;margin-top:18px;font-size:1rem;font-weight:800;color:var(--muted)}
    #status.ok{color:#76df9a} #status.bad{color:#ff6570}
    .note{margin:8px 0 0;color:var(--muted)}
    @media(max-width:650px){
      body{padding:20px 12px 40px}
      .inline,.duration,.actions{grid-template-columns:1fr}
      input,select,button{min-height:58px;font-size:1rem}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="../assets/logos/eyesslim.gif" alt="House of Deceit">
    <p class="eyebrow">House control</p>
    <h1 id="heading">Countdown</h1>
    <p><a id="publicLink" href="./" style="color:var(--yellow)">Open public countdown</a></p>
    <section class="panel">
      <div class="field">
        <label for="mode">Countdown type</label>
        <select id="mode">
          <option value="target">End at a date &amp; time</option>
          <option value="duration">Start a timed duration now</option>
        </select>
      </div>

      <div id="targetControls" class="field">
        <label for="target">End date &amp; time (UK)</label>
        <div class="inline">
          <input id="target" type="datetime-local">
          <button id="twoWeeks" class="secondary" type="button">+ 2 WEEKS</button>
        </div>
      </div>

      <div id="durationControls" class="field" hidden>
        <label>Duration</label>
        <div class="duration">
          <div><label for="hours">Hours</label><input id="hours" type="number" min="0" value="1"></div>
          <div><label for="mins">Minutes</label><input id="mins" type="number" min="0" max="59" value="0"></div>
          <div><label for="secs">Seconds</label><input id="secs" type="number" min="0" max="59" value="0"></div>
          <button id="oneHour" class="secondary" type="button">1 HOUR</button>
        </div>
      </div>

      <div class="field">
        <label for="label">Message above countdown</label>
        <input id="label" type="text" placeholder="For example: The final reveal">
        <p class="note">This appears immediately on the public countdown screen.</p>
      </div>

      <div id="ctaControls" hidden>
        <div class="field">
          <label for="ctaText">Button text</label>
          <input id="ctaText" type="text" placeholder="Follow Insta for Strategies and More">
          <p class="note">Leave blank to hide the button.</p>
        </div>
        <div class="field">
          <label for="ctaUrl">Button link</label>
          <input id="ctaUrl" type="url" placeholder="https://www.instagram.com/house.of.deceit/">
        </div>
      </div>
      <div class="actions">
        <button id="save" type="button">SAVE &amp; UPDATE</button>
        <button id="load" class="secondary" type="button">LOAD CURRENT</button>
      </div>
      <span id="status" aria-live="polite"></span>
    </section>
  </main>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabase=createClient(
    "https://hhyfixoxwxmzncosmcqo.supabase.co",
    "sb_publishable_KWvHkZqW2aAipujklitrdg_C7bSBFce"
  );

// Each code has an independent row; the original countdown keeps "main".
const routeCode = location.pathname.split("/").filter(Boolean)[0];
const COUNTDOWN_ID = ({countdownH:"H",countdownO:"O",countdownD:"D"})[routeCode] || "main";
const DEFAULTS = {
  H:{end_time:"2026-10-09T21:00:00+01:00"},
  O:{end_time:"2026-12-11T21:00:00+00:00"},
  D:{end_time:"2027-02-19T21:00:00+00:00"}
};
const defaultSettings = {
  message:"The Murders Begin",
  ctaText:"Follow Insta for Strategies and More",
  ctaUrl:"https://www.instagram.com/house.of.deceit/"
};
function decodeSettings(label){
  try {
    const parsed=JSON.parse(label);
    if(parsed && parsed.version===1) return {...defaultSettings,...parsed};
  } catch {}
  return {...defaultSettings,message:label ?? defaultSettings.message};
}
function safeUrl(value){
  try { const url=new URL(value); return ["https:","http:"].includes(url.protocol)?url.href:""; }
  catch { return ""; }
}

  const $=id=>document.getElementById(id);
  const statusEl=$("status");
  $("heading").textContent=COUNTDOWN_ID==="main"?"Countdown":`Countdown ${COUNTDOWN_ID}`;
  $("ctaControls").hidden=COUNTDOWN_ID==="main";
  $("publicLink").href=COUNTDOWN_ID==="main"?"/countdown/":`/countdown${COUNTDOWN_ID}/`;
  const pad=n=>String(n).padStart(2,"0");

  function showControls(){
    const target=$("mode").value==="target";
    $("targetControls").hidden=!target;
    $("durationControls").hidden=target;
  }

  function setStatus(message,ok=true){
    statusEl.className=ok?"ok":"bad";
    statusEl.textContent=message;
  }

  function londonParts(date){
    return Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(date).map(p=>[p.type,p.value]));
  }
  function setTarget(date){
    const p=londonParts(date);
    $("target").value=`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
  }
  function ukDate(value){
    const [y,m,d,h,min]=value.match(/\d+/g).map(Number);
    const wall=Date.UTC(y,m-1,d,h,min);
    let instant=wall;
    for(let i=0;i<3;i++){
      const p=londonParts(new Date(instant));
      const represented=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);
      instant+=wall-represented;
    }
    const result=new Date(instant);
    const p=londonParts(result);
    if(`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`!==value) return null;
    return result;
  }

  $("mode").addEventListener("change",showControls);
  $("twoWeeks").addEventListener("click",()=>{setTarget(new Date(Date.now()+14*24*60*60*1000));setStatus("Set to 2 weeks from now.")});
  $("oneHour").addEventListener("click",()=>{$("hours").value=1;$("mins").value=0;$("secs").value=0;setStatus("Set to 1 hour.")});

  async function loadCurrent(){
    setStatus("Loading…");
    const {data,error}=await supabase.from("countdowns").select("id,label,end_time,updated_at").eq("id","main").maybeSingle();
    if(error){setStatus(error.message,false);return}
    let documentSettings;
    try{documentSettings=JSON.parse(data?.label)}catch{}
    const group=COUNTDOWN_ID==="main"
      ? (data && {...data,label:documentSettings?.version===2?documentSettings.message:data.label})
      : documentSettings?.version===2?documentSettings.groups?.[COUNTDOWN_ID]:null;
    const current=group || (DEFAULTS[COUNTDOWN_ID] && {...DEFAULTS[COUNTDOWN_ID],label:JSON.stringify({version:1,...defaultSettings})});
    if(!current){setStatus("No countdown has been saved yet.",false);return}
    const settings=decodeSettings(current.label);
    $("label").value=settings.message;
    $("ctaText").value=settings.ctaText;
    $("ctaUrl").value=settings.ctaUrl;
    setTarget(new Date(current.end_time));
    $("mode").value="target";
    showControls();
    setStatus("Current countdown loaded.");
  }

  async function save(){
    let endTime;
    if($("mode").value==="target"){
      if(!$("target").value){setStatus("Choose an end date & time.",false);return}
      endTime=ukDate($("target").value);
      if(!endTime){setStatus("Choose a valid UK date & time.",false);return}
    }else{
      const seconds=(Number($("hours").value||0)*3600)+(Number($("mins").value||0)*60)+Number($("secs").value||0);
      if(seconds<=0){setStatus("Set a duration greater than zero.",false);return}
      endTime=new Date(Date.now()+seconds*1000);
    }

    const ctaText=$("ctaText").value.trim();
    const ctaUrl=safeUrl($("ctaUrl").value.trim());
    if(COUNTDOWN_ID!=="main" && ctaText && !ctaUrl){setStatus("Enter a valid http or https button link.",false);return}
    $("save").disabled=true;
    setStatus("Saving…");
    const {data:base,error:readError}=await supabase.from("countdowns").select("*").eq("id","main").maybeSingle();
    if(readError || !base){$("save").disabled=false;setStatus(readError?.message || "Could not load the saved countdown.",false);return}
    let documentSettings;
    try{documentSettings=JSON.parse(base.label)}catch{}
    if(documentSettings?.version!==2) documentSettings={version:2,message:base.label || "",groups:{}};
    const patch={updated_at:new Date().toISOString()};
    if(COUNTDOWN_ID==="main"){
      documentSettings.message=$("label").value.trim();
      patch.end_time=endTime.toISOString();
    }else{
      documentSettings.groups={...documentSettings.groups,[COUNTDOWN_ID]:{
        end_time:endTime.toISOString(),
        label:JSON.stringify({version:1,message:$("label").value.trim(),ctaText,ctaUrl})
      }};
    }
    patch.label=JSON.stringify(documentSettings);
    let query=supabase.from("countdowns").update(patch).eq("id","main");
    query=base.updated_at?query.eq("updated_at",base.updated_at):query.is("updated_at",null);
    const {data:saved,error}=await query.select("id");
    $("save").disabled=false;
    if(error)setStatus(error.message,false);
    else if(!saved?.length)setStatus("Another update was made. Load current and save again.",false);
    else setStatus("Saved. The public countdown is now updated.");
  }

  $("load").addEventListener("click",loadCurrent);
  $("save").addEventListener("click",save);
  showControls();
  loadCurrent();
</script>
</body>
</html>
